name: asr_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch>=2.2.0
      - torchvision
      - torchaudio>=2.2.0
      - transformers==4.49.0
      - accelerate>=1.0.0
      - huggingface_hub>=0.28.0
      - optimum-quanto>=0.2.7
      - bitsandbytes>=0.50.0
      - jiwer==3.0.3
      - soundfile>=0.12.1
      - librosa>=0.11.0
      - scipy>=1.12.0
      - numpy>=1.26.4
      - pandas>=2.2.0
      - matplotlib>=3.8.0
      - seaborn>=0.13.0
      - tabulate>=0.9.0
      - tqdm>=4.66.0
      - fastapi>=0.110.0
      - uvicorn>=0.30.0
      - wandb>=0.18.0
      - pyyaml>=6.0.0
      - pymupdf>=1.24.0
      - python-docx>=1.1.0
      - -e ./whisper-medusa
